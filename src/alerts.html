<body data-page="alerts"><header><div class="top"><strong class="brand"><img class="ls-brand-icon" src="/assets/linkscope.ico" alt="" width="32" height="32">{{brand}}</strong><nav aria-label="Main"><a href="/"><svg class="ls-menu-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 5h18v12H3z M8 21h8 M12 17v4"/></svg>Network</a><a href="/system"><svg class="ls-menu-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M2 12h5l3-7 4 14 3-7h5"/></svg>System health</a><a href="/integrity"><svg class="ls-menu-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 2 3 6v6c0 5 5 9 9 10 4-1 9-5 9-10V6z M8 12l3 3 5-6"/></svg>Data Integrity</a><a href="/alerts" aria-current="page"><svg class="ls-menu-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 8-3 9h18c0-1-3-2-3-9 M10 21h4"/></svg>Alert history</a><a href="/logs"><svg class="ls-menu-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M5 3h14v18H5z M8 8h8 M8 12h8 M8 16h6"/></svg>Logs</a><a href="/audit"><svg class="ls-menu-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M8 7a4 4 0 1 0 8 0 4 4 0 0 0-8 0 M4 21v-3a8 8 0 0 1 16 0v3 M16 16l2 2 3-3"/> <main><div id="pdf-status" role="status" aria-live="polite"></div><h1>Alert history</h1><form id="history-search"><label class="field">Search alerts<input type="search" id="alert-query" maxlength="200" placeholder="Text, IP address, target name or alert ID"></label>
<details id="advanced-search"><summary>Advanced filters</summary><div class="grid">
<label class="field">Category<select id="alert-category"><option value="">All categories</option></select></label>
<label class="field">Severity<select id="alert-severity"><option value="">All severities</option><option value="info">Info</option><option value="warning">Warning</option><option value="error">Error</option><option value="critical">Critical</option></select></label>
<label class="field">Alert state<select id="alert-state"><option value="">Any state</option><option value="active">Active</option><option value="resolved">Resolved</option></select></label>
<label class="field">Read status<select id="alert-read"><option value="">Read and unread</option><option value="unread">Unread</option><option value="read">Read</option></select></label>
<label class="field">Opened from (local date)<input id="alert-from" type="date" min="1970-01-01"></label>
<label class="field">Opened through (local date)<input id="alert-until" type="date" min="1970-01-01"></label></div></details>
<button type="submit">Search</button> <button type="button" id="clear-search">Clear search</button></form>
<div class="history-tools"><span id="history-count">Loading alert history…</span><button type="button" id="refresh-history">Refresh</button><button type="button" id="read-all" title="Includes alerts outside the current search, through this snapshot" disabled>Mark all alerts as read</button></div>
<div id="history-status" role="status"></div><div class="tablewrap"><table class="alert-results"><thead><tr><th>Opened</th><th>Alert</th><th>Category</th><th>Severity</th><th>State</th><th>Read status</th></tr></thead><tbody id="history-list"></tbody></table></div><div id="history-pager"></div></main></body></html>
