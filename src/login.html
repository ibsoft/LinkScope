<!doctype html><html lang="en"><head><link rel="icon" type="image/x-icon" href="/assets/linkscope.ico"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/assets/loading.css"><script defer src="/assets/loading.js"></script><title>Sign in · {{brand}}</title><link rel="stylesheet" href="/assets/app.css"><script defer src="/assets/app.js"></script><link rel="stylesheet" href="/assets/toast.css"><script defer src="/assets/toast.js"></script></head><body data-page="login"><header><div class="top"><strong class="brand"><img class="ls-brand-icon" src="/assets/linkscope.ico" alt="" width="32" height="32">{{brand}}</strong></div></header><main><section class="login"><h1>Sign in</h1><form id="loginForm"><label class="field">Username<input name="user" autocomplete="username" required value="admin" maxlength="64"></label><label class="field">Password<input name="password" type="password" autocomplete="current-password" required maxlength="128"></label><fieldset id="firstUse" hidden disabled>
<legend>Choose your new password</legend>
<p id="passwordRules">Use 7–128 characters with at least one uppercase letter (A–Z), one lowercase letter (a–z), and one digit (0–9). Symbols are optional.</p>
<label class="field">New password<input name="newPassword" type="password" autocomplete="new-password" minlength="7" maxlength="128" aria-describedby="passwordRules" required></label>
<label class="field">Confirm new password<input name="confirmPassword" type="password" autocomplete="new-password" minlength="7" maxlength="128" required></label>
</fieldset><button id="signInButton" type="submit"><span id="signInSpinner" class="ls-spinner" aria-hidden="true" hidden></span><span id="signInLabel">Sign in</span></button></form><div role="status" class="notice" id="notice"></div></section></main></body></html>
