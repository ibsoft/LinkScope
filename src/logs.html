<body data-page="logs"><header><div class="top"><strong class="brand"><img class="ls-brand-icon" src="/assets/linkscope.ico" alt="" width="32" height="32">{{brand}}</strong><nav aria-label="Main"><a href="/"><svg class="ls-menu-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 5h18v12H3z M8 21h8 M12 17v4"/></svg>Network</a><a href="/system"><svg class="ls-menu-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M2 12h5l3-7 4 14 3-7h5"/></svg>System health</a><a href="/integrity"><svg class="ls-menu-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 2 3 6v6c0 5 5 9 9 10 4-1 9-5 9-10V6z M8 12l3 3 5-6"/></svg>Data Integrity</a><a href="/alerts"><svg class="ls-menu-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 8-3 9h18c0-1-3-2-3-9 M10 21h4"/></svg>Alert history</a><a href="/logs" aria-current="page"><svg class="ls-menu-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M5 3h14v18H5z M8 8h8 M8 12h8 M8 16h6"/></svg>Logs</a><a href="/audit"><svg class="ls-menu-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M8 7a4 4 0 1 0 8 0 4 4 0 0 0-8 0 M4 21v-3a8 8 0 0 1 16 0v3 M16 16l2 2 3-3"/></svg>User audit</a><a href="/ai"><svg class="ls-menu-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 2l2.5 7.5L22 12l-7.5 2.5L12 22l-2.5-7.5L2 12l7.5-2.5z"/></svg>AI Assist</a><a href="/settings"><svg class="ls-menu-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 3v3 M12 18v3 M3 12h3 M18 12h3 M5.6 5.6l2.1 2.1 M16.3 16.3l2.1 2.1 M18.4 5.6l-2.1 2.1 M7.7 16.3l-2.1 2.1 M6 12a6 6 0 1 0 12 0 6 6 0 0 0-12 0"/></svg>Settings</a><button id="global-export" type="button"><svg class="ls-menu-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M5 3h10l4 4v14H5z M14 3v5h5 M12 10v7 M9 14l3 3 3-3"/></svg>Export PDF</button></nav></div></header>
<main><div id="pdf-status" role="status"></div><h1>Application logs</h1>
<form id="log-form"><label class="field">Search logs<input id="log-q" type="search" maxlength="200" placeholder="Message, module, operation or IP address"></label>
<details open><summary>Advanced filters</summary><div class="grid">
<label class="field">Level<select id="log-level"><option value="">All levels</option><option>Debug</option><option>Info</option><option>Warning</option><option>Error</option></select></label>
<label class="field">Module<select id="log-module"><option value="">All modules</option></select></label>
<label class="field">Operation contains<input id="log-operation" maxlength="100"></label>
<label class="field">Client or target IP<input id="log-peer" maxlength="80"></label>
<label class="field">HTTP status<input id="log-status" type="number" min="100" max="599"></label>
<label class="field">From (local time)<input id="log-from" type="datetime-local" min="1970-01-02T00:00"></label>
<label class="field">Until (local time, exclusive)<input id="log-until" type="datetime-local" min="1970-01-02T00:00"></label></div></details>
<button type="submit">Search</button> <button type="button" id="log-clear">Clear filters</button> <button type="button" id="log-refresh">Refresh</button></form>
<p id="log-feedback" role="status"></p><div class="tablewrap"><table><thead><tr><th>Local time</th><th>Level</th><th>Module</th><th>Operation</th><th>Message</th><th>Client / target IP</th><th>HTTP</th><th>Duration</th></tr></thead>
<tbody id="log-list"></tbody></table></div><div id="log-pager"></div></main></body></html>
